[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot"
version = "0.0.2"
description = "Open source bimanual robot"
authors = [
    { name = "NYU GRAIL" }
]
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"
dependencies = [
    "phoenix6",
    "numpy",
    "pyzmq",
    "pygame",
    "pillow",
    "mujoco>=3.2.7",
    "mink",
    "tqdm",
    "loop-rate-limiters>=1.1.0",
    "commlink>=0.2.1",
    "dynamixel_sdk",
]

[project.urls]
Homepage = "https://github.com/NYU-robot-learning/robot.git"

[tool.setuptools]
packages = ["robot"]
include-package-data = true

[project.optional-dependencies]
dev = []
nav = ["viser", "opencv-python", "scipy"]
# Odin 1 sensor stack (commlink/numpy/pyzmq/loop-rate-limiters are in base deps).
# Note: the pyodin bridge is a compiled pybind11 module built via pyodin/build.sh,
# not a pip dependency. setup_odin.sh installs these with --no-deps to skip the
# heavy robot/sim base deps (phoenix6, mujoco, dynamixel) for sensor bring-up.
odin = ["viser", "opencv-python", "scipy", "msgpack", "msgpack-numpy", "pyyaml"]
